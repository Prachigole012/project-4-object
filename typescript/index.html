<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Product Store</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <header class="mt-3">
        <div class="container">
            <div class="row">
                <div class="head">
                    <div class="col-12">
                        <div class="header d-flex justify-content-between">
                            <div class="col-2">
                                <div class="logo">
                                    <h3>Product</h3>
                                </div>
                            </div>
                            <div class="col-6">
                                <form class="d-flex" role="search">
                                    <input class="form-control me-2" type="search" placeholder="Search"
                                        aria-label="Search" />
                                </form>
                            </div>
                            <div class="col-2">
                                <div class="nav-icon">
                                    <ul class="d-flex list-unstyled fs-4 justify-content-evenly">
                                        <li>
                                            <i class="ri-poker-hearts-line"></i>
                                        </li>
                                        <li>
                                            <i class="ri-user-line"></i>
                                        </li>
                                        <li>
                                            <i class="ri-shopping-cart-2-line"></i>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>

        <!-- navbar -->
        <section>
            <div class="container">
                <div class="row">
                    <div class="navbar">
                        <div class="col-8 mx-auto">
                            <div class="nav-menu">
                                <ul class="d-flex list-unstyled fs-5 justify-content-around text-black">
                                    <li>Home</li>
                                    <li>Products</li>
                                    <li>About</li>
                                    <li>Contact</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- hero section -->
        <section class="herosection">
            <div class="position-absolute top-50 start-50 translate-middle">
                <h1 class="mx-auto text-center  display-1 fw-bolder">
                    La Petite Miette
                </h1>
                <h2 class="text-center">-Produts-</h2>
                <div class="text-center mt-4">
                    <button class="btn btn-primary bg-black border-black px-4 me-2">
                        Visit
                    </button>
                    <button class="btn border-black">
                        Contact Us
                    </button>
                </div>
            </div>
        </section>

        <!-- section card -->
        <section class="hero-sec d-flex flex-wrap">
            
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
</body>

</html>
